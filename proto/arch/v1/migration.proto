syntax = "proto3";

package arch.v1;

// Migration 是从起点架构图走向终点架构图的迁移路线，阶段按声明顺序执行。
message Migration {
  string title = 1;
  repeated Phase phases = 2;
  // 起点架构图，取数据目录下的目录名。
  string baseline = 3;
  // 终点架构图，取数据目录下的目录名。
  string target = 4;
}

// Phase 是迁移路线的一个阶段：交付终点架构图中的组件，下线起点架构图中被替代的组件。
message Phase {
  string title = 1;
  // 阶段目标与主要做法。
  string description = 2;
  // 交付的终点架构图节点 ID，容器节点代表其全部后代；每个新增或改造的叶子节点恰好交付一次。
  repeated string nodes = 3;
  // 下线的起点架构图叶子节点 ID；终点架构图中不再存在的叶子节点恰好下线一次。
  repeated string retires = 4;
  // 完成标准。
  string exit_criteria = 5;
}
